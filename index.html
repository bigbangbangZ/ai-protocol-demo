<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI语义交换协议 · 多模型自由协作</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f7fb; margin: 0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { font-weight: 600; font-size: 28px; margin-bottom: 5px; }
        .subtitle { color: #5e6870; margin-bottom: 20px; border-left: 4px solid #3b82f6; padding-left: 16px; }
        .mission { background: #e6f0ff; border-radius: 12px; padding: 12px 20px; margin-bottom: 25px; color: #1e3a8a; font-weight: 500; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .contact { color: #2563eb; text-decoration: none; font-weight: 600; }

        .control-bar { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; align-items: center; }
        .lang-selector, .mode-selector, .model-selector { background: white; padding: 8px 16px; border-radius: 40px; border: 1px solid #cbd5e1; display: flex; align-items: center; gap: 10px; }
        select, input[type="number"] { border: none; background: transparent; font-size: 14px; padding: 5px; outline: none; }
        .round-selector { background: white; padding: 8px 16px; border-radius: 40px; border: 1px solid #cbd5e1; display: flex; align-items: center; gap: 8px; }
        .round-selector input { width: 60px; border: 1px solid #cbd5e1; border-radius: 20px; padding: 4px 8px; text-align: center; }

        .model-config { background: #f8fafc; border-radius: 20px; padding: 20px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .model-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
        .model-card { flex: 1; min-width: 280px; background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); border: 1px solid #eef2f6; }
        .model-title { font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .model-input { margin-bottom: 10px; }
        .model-input label { font-size: 12px; color: #64748b; display: block; margin-bottom: 3px; }
        .model-input input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }

        .participant-selector { margin-top: 20px; background: white; border-radius: 16px; padding: 16px; border: 1px solid #e2e8f0; }
        .participant-checkboxes { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 10px; }
        .participant-checkbox { display: flex; align-items: center; gap: 8px; }
        .task-input-area { margin-top: 20px; display: flex; gap: 15px; align-items: flex-end; }
        .task-input-area .input-group { flex: 1; }
        .task-input-area label { font-size: 13px; font-weight: 500; color: #334155; }
        .task-input-area input, .task-input-area textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 5px; }
        .btn { padding: 10px 24px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; background: #3b82f6; color: white; transition: 0.2s; }
        .btn-outline { background: white; color: #3b82f6; border: 1px solid #3b82f6; }

        .result-panel { background: white; border-radius: 24px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.02); margin-top: 20px; }
        .turn { margin-bottom: 35px; border-bottom: 1px solid #e2e8f0; padding-bottom: 25px; }
        .turn-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .badge { padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: 500; }
        .utterance { background: #f8fafc; border-radius: 16px; padding: 16px 20px; margin-bottom: 15px; line-height: 1.6; }
        .deliverable { background: #ecfdf5; border-radius: 16px; padding: 16px 20px; margin-bottom: 15px; border: 1px solid #a7f3d0; }
        .deliverable-label { font-weight: 600; color: #065f46; margin-bottom: 8px; }
        .meta-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 12px; }
        .meta-card { background: #f1f5f9; border-radius: 12px; padding: 12px 16px; }
        .meta-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; color: #475569; margin-bottom: 6px; }
        .meta-value { font-size: 14px; word-break: break-word; }
        .confidence-bar { height: 6px; background: #cbd5e1; border-radius: 6px; margin-top: 5px; }
        .confidence-fill { height: 6px; background: #3b82f6; border-radius: 6px; }

        .footer { margin-top: 30px; text-align: center; color: #64748b; font-size: 14px; border-top: 1px dashed #cbd5e1; padding-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="main-title">🤖 AI语义交换协议 · 多模型自由协作</h1>
    <div class="subtitle" id="subtitle-text">Token聚焦 · 嵌入延展 · 双置信度 · 解码收敛 · 角色协商 · 成果输出</div>

    <div class="mission" id="mission-statement">
        <span id="mission-text">🌐 中立·免费·去中心化 —— 让异构AI真正理解彼此，自由协作。</span>
        <span id="contact-info">📧 交流/共建：<a class="contact" href="mailto:345363980@qq.com">345363980@qq.com</a></span>
    </div>

    <div class="control-bar">
        <div class="lang-selector">
            <span>🌍</span>
            <select id="lang-select">
                <option value="zh">中文</option>
                <option value="en">English</option>
            </select>
        </div>
        <div class="mode-selector">
            <span>⚡</span>
            <select id="mode-select">
                <option value="debate">对抗辩论</option>
                <option value="collab">协同任务</option>
            </select>
        </div>
        <div class="round-selector">
            <span>🔄 轮数</span>
            <input type="number" id="rounds-input" min="1" max="5" value="2">
        </div>
        <div style="flex:1"></div>
        <button class="btn-outline" id="clear-btn">🧹 清空</button>
    </div>

    <div class="model-config" id="model-config-panel"></div>

    <div class="participant-selector">
        <div style="font-weight:600;">👥 选择参与本次对话的模型（至少2个）</div>
        <div class="participant-checkboxes" id="participant-checkboxes"></div>
    </div>

    <div class="task-input-area">
        <div class="input-group">
            <label id="task-label">任务描述</label>
            <input type="text" id="task-input" value="远程办公应成为未来主要工作模式" placeholder="输入主题或任务描述">
        </div>
        <button class="btn" id="execute-btn">🚀 启动</button>
    </div>

    <div class="result-panel" id="result-container">
        <div style="text-align: center; color: #94a3b8; padding: 30px;">配置模型并启动，AI们将自由协商角色并输出成果</div>
    </div>

    <div class="footer">
        <p>⚡ AI语义交换协议 v0.5 · 多模型 · 角色协商 · 双置信度 · 成果输出</p>
        <p>字段: 聚焦 · 延展 · 自置信度 · 输出置信度 · 收敛 · 意图 · 角色 · 依赖 · 假设 · 行动 · 融合 · 交付物</p>
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- 多语言资源 ----------
        const i18n = {
            zh: {
                mainTitle: "🤖 AI语义交换协议 · 多模型自由协作",
                subtitle: "Token聚焦 · 嵌入延展 · 双置信度 · 解码收敛 · 角色协商 · 成果输出",
                missionText: "🌐 中立·免费·去中心化 —— 让异构AI真正理解彼此，自由协作。",
                contactInfo: "📧 交流/共建：<a class=\"contact\" href=\"mailto:345363980@qq.com\">345363980@qq.com</a>",
                configTitle: "🔧 模型配置 (填入API密钥)",
                taskLabel: "任务描述",
                executeBtn: "🚀 启动",
                clearBtn: "清空",
                waiting: "正在处理，请稍候...",
                error: "错误",
                focus: "聚焦",
                extension: "延展",
                selfConfidence: "自置信度",
                outputConfidence: "输出置信度",
                convergence: "收敛",
                intent: "意图",
                role: "角色",
                depends: "依赖",
                assumptions: "假设",
                actionable: "行动指引",
                merge: "融合策略",
                deliverable: "📦 交付成果"
            },
            en: {
                mainTitle: "🤖 AI Semantic Exchange Protocol · Multi-Agent Free Collaboration",
                subtitle: "Token Focus · Embedding Extension · Dual Confidence · Decoding Convergence · Role Negotiation · Deliverables",
                missionText: "🌐 Neutral, Free, Decentralized — enabling AIs to truly understand and collaborate.",
                contactInfo: "📧 Discuss/Contribute: <a class=\"contact\" href=\"mailto:345363980@qq.com\">345363980@qq.com</a>",
                configTitle: "🔧 Model Configuration (API Keys)",
                taskLabel: "Task Description",
                executeBtn: "🚀 Start",
                clearBtn: "Clear",
                waiting: "Processing...",
                error: "Error",
                focus: "Focus",
                extension: "Extension",
                selfConfidence: "Self Confidence",
                outputConfidence: "Output Confidence",
                convergence: "Convergence",
                intent: "Intent",
                role: "Role",
                depends: "Depends On",
                assumptions: "Assumptions",
                actionable: "Actionable",
                merge: "Merge Strategy",
                deliverable: "📦 Deliverable"
            }
        };

        let currentLang = 'zh';
        let currentMode = 'debate';
        const langSelect = document.getElementById('lang-select');
        const modeSelect = document.getElementById('mode-select');
        const taskInput = document.getElementById('task-input');
        const taskLabel = document.getElementById('task-label');
        const executeBtn = document.getElementById('execute-btn');
        const clearBtn = document.getElementById('clear-btn');
        const resultContainer = document.getElementById('result-container');
        const modelPanel = document.getElementById('model-config-panel');
        const participantDiv = document.getElementById('participant-checkboxes');

        // 支持的模型列表（含所需字段）
        const modelDefs = [
            { id: 'doubao', name: '豆包 (Doubao)', fields: ['apiKey', 'endpointId'] },
            { id: 'deepseek', name: 'DeepSeek', fields: ['apiKey'] },
            { id: 'openai', name: 'OpenAI (GPT-4o)', fields: ['apiKey'] },
            { id: 'claude', name: 'Claude', fields: ['apiKey'] },
            { id: 'wenxin', name: '文心一言', fields: ['apiKey', 'secretKey'] },
            { id: 'tongyi', name: '通义千问', fields: ['apiKey'] },
            { id: 'zhipu', name: '智谱GLM', fields: ['apiKey'] },
            { id: 'gemini', name: 'Gemini', fields: ['apiKey'] }
        ];

        // 渲染模型配置面板和参与者复选框
        function renderModelConfig() {
            const lang = i18n[currentLang];
            let html = `<div style="font-weight:600; margin-bottom:15px;">${lang.configTitle}</div><div class="model-row">`;
            modelDefs.forEach(m => {
                html += `<div class="model-card"><div class="model-title">🤖 ${m.name}</div>`;
                m.fields.forEach(f => {
                    const label = f === 'apiKey' ? 'API Key' : (f === 'endpointId' ? 'Endpoint ID' : 'Secret Key');
                    html += `<div class="model-input"><label>${label}</label><input type="password" id="${m.id}-${f}" placeholder="输入密钥" autocomplete="off"></div>`;
                });
                html += `</div>`;
            });
            html += `</div>`;
            modelPanel.innerHTML = html;

            // 渲染参与者复选框
            let checkboxes = '';
            modelDefs.forEach(m => {
                checkboxes += `<div class="participant-checkbox"><input type="checkbox" id="chk-${m.id}" value="${m.id}" checked> <label for="chk-${m.id}">${m.name}</label></div>`;
            });
            participantDiv.innerHTML = checkboxes;
        }

        // 获取选中的模型ID列表
        function getSelectedModels() {
            const selected = [];
            modelDefs.forEach(m => {
                const chk = document.getElementById(`chk-${m.id}`);
                if (chk && chk.checked) selected.push(m.id);
            });
            return selected;
        }

        // 获取模型凭据
        function getModelCredentials() {
            const creds = {};
            modelDefs.forEach(m => {
                const obj = {};
                m.fields.forEach(f => {
                    obj[f] = document.getElementById(`${m.id}-${f}`)?.value.trim() || '';
                });
                creds[m.id] = obj;
            });
            return creds;
        }

        // 构建系统提示词（包含所有协议字段）
        function buildSystemPrompt(mode, isFirstRound) {
            const base = `你正在参与"AI语义交换协议"。请严格按照以下JSON格式输出，不要包含其他任何文字：
{
  "utterance": "你的发言内容",
  "focus": "token[词1(权重), 词2(权重)...]",
  "extension": "激活语义场:[...] 候选token:[...]",
  "self_confidence": 0.0~1.0对自己观点的确信度,
  "output_confidence": 0.0~1.0对本次输出序列的整体概率置信度,
  "convergence_process": "多层Transformer计算后的解码决策路径描述",
  "intent": "你的意图(propose/agree/disagree/request/confirm/question/summarize等)",
  "role": "你在此次对话中为自己协商确定的角色(如: 正方辩手/反方辩手/规划者/执行者/审核者/协作者等)",
  "depends_on": ["依赖的前置消息ID或摘要"],
  "assumptions": ["你的假设"],
  "actionable": "下一步行动建议",
  "merge_strategy": "冲突时的融合策略(override/append/vote/defer)",
  "deliverable": "如果你产出了实际成果(文本/计划/代码/表格等)，请放在这里；若无则留空字符串"
}`;
            if (isFirstRound) {
                return base + `\n这是第一轮对话，你需要根据任务上下文和自身定位，通过role字段为自己协商一个合适的角色。`;
            }
            return base;
        }

        // 调用单个模型API
        async function callModel(modelId, messages, credentials) {
            const cred = credentials[modelId];
            if (!cred) throw new Error(`Missing credentials for ${modelId}`);
            const systemPrompt = buildSystemPrompt(currentMode, messages.length <= 1);
            const fullMessages = [{ role: 'system', content: systemPrompt }, ...messages];

            // 各模型API调用逻辑 (与之前类似，增加字段处理)
            if (modelId === 'doubao') {
                if (!cred.apiKey || !cred.endpointId) throw new Error('豆包需API Key和Endpoint ID');
                const resp = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: cred.endpointId, messages: fullMessages, response_format: { type: "json_object" } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'deepseek') {
                if (!cred.apiKey) throw new Error('DeepSeek需API Key');
                const resp = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'deepseek-chat', messages: fullMessages, response_format: { type: 'json_object' }, max_tokens: 2000 })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'openai') {
                if (!cred.apiKey) throw new Error('OpenAI需API Key');
                const resp = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'gpt-4o', messages: fullMessages, response_format: { type: "json_object" } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'claude') {
                if (!cred.apiKey) throw new Error('Claude需API Key');
                const resp = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: { 'x-api-key': cred.apiKey, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'claude-3-5-sonnet-20241022', max_tokens: 2000, messages: messages, system: systemPrompt })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                const text = data.content[0].text;
                const jsonMatch = text.match(/{[\s\S]*}/);
                if (!jsonMatch) throw new Error('Claude未返回有效JSON');
                return JSON.parse(jsonMatch[0]);
            }
            else if (modelId === 'wenxin') {
                if (!cred.apiKey || !cred.secretKey) throw new Error('文心需API Key和Secret Key');
                const tokenResp = await fetch(`https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${cred.apiKey}&client_secret=${cred.secretKey}`);
                const tokenData = await tokenResp.json();
                if (!tokenData.access_token) throw new Error('文心token获取失败');
                const resp = await fetch(`https://aip.baidubce.com/rpc/2.0/ai_custom/v1/wenxinworkshop/chat/completions?access_token=${tokenData.access_token}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: fullMessages, response_format: 'json_object' })
                });
                const data = await resp.json();
                if (data.error_msg) throw new Error(data.error_msg);
                return JSON.parse(data.result);
            }
            else if (modelId === 'tongyi') {
                if (!cred.apiKey) throw new Error('通义需API Key');
                const resp = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
                    method: 'POST', headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'qwen-plus', messages: fullMessages, response_format: { type: 'json_object' } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'zhipu') {
                if (!cred.apiKey) throw new Error('智谱需API Key');
                const resp = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                    method: 'POST', headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'glm-4', messages: fullMessages, response_format: { type: 'json_object' } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'gemini') {
                if (!cred.apiKey) throw new Error('Gemini需API Key');
                const prompt = fullMessages.map(m => `${m.role}: ${m.content}`).join('\n');
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${cred.apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message);
                const text = data.candidates[0].content.parts[0].text;
                const jsonMatch = text.match(/{[\s\S]*}/);
                if (!jsonMatch) throw new Error('Gemini未返回有效JSON');
                return JSON.parse(jsonMatch[0]);
            }
            throw new Error(`不支持的模型: ${modelId}`);
        }

        // 构建元数据消息传递给其他模型
        function buildMetaMessage(speakerModel, turnData) {
            const jsonStr = JSON.stringify(turnData, null, 2);
            return `来自 ${speakerModel} 的发言与元数据：\n${turnData.utterance}\n\n协议元数据:\n\`\`\`json\n${jsonStr}\n\`\`\`\n请结合上述信息继续。`;
        }

        // 执行多模型对话
        async function runTask() {
            const credentials = getModelCredentials();
            const selectedModels = getSelectedModels();
            const task = taskInput.value.trim();
            const rounds = parseInt(document.getElementById('rounds-input').value) || 2;

            if (selectedModels.length < 2) { alert('请至少选择2个模型'); return; }
            for (let id of selectedModels) {
                if (!credentials[id] || !credentials[id].apiKey) { alert(`请填写 ${id} 的API密钥`); return; }
            }

            resultContainer.innerHTML = `<div style="text-align:center;padding:30px;">⏳ ${i18n[currentLang].waiting}</div>`;

            try {
                // 为每个模型初始化消息数组
                const modelMessages = {};
                selectedModels.forEach(id => { modelMessages[id] = []; });

                // 首轮提示：告知任务和模式
                const firstUserMsg = currentMode === 'debate' 
                    ? `辩论主题：“${task}”。请根据自身定位发言，并通过role字段声明你的角色（如正方/反方/裁判等）。`
                    : `协同任务：“${task}”。请根据任务需要，通过role字段协商并声明你的角色（如规划者/执行者/审核者/协作者等），并产出实际成果。`;

                const history = [];
                // 轮流发言：第一轮按选定顺序，后续基于前一轮所有发言
                for (let r = 0; r < rounds; r++) {
                    for (let modelId of selectedModels) {
                        const msgs = modelMessages[modelId];
                        if (msgs.length === 0) {
                            msgs.push({ role: 'user', content: firstUserMsg });
                        } else {
                            // 收集上一轮所有其他模型的发言作为上下文
                            const lastRoundStart = Math.max(0, history.length - selectedModels.length);
                            for (let i = lastRoundStart; i < history.length; i++) {
                                const prev = history[i];
                                if (prev.model !== modelId) {
                                    msgs.push({ role: 'user', content: buildMetaMessage(prev.model, prev) });
                                }
                            }
                        }

                        const turn = await callModel(modelId, msgs, credentials);
                        turn.model = modelId;
                        history.push(turn);
                        msgs.push({ role: 'assistant', content: JSON.stringify(turn) });
                    }
                }

                renderHistory(history);
            } catch (e) {
                resultContainer.innerHTML = `<div style="color:red; padding:20px;">❌ ${i18n[currentLang].error}: ${e.message}</div>`;
            }
        }

        function renderHistory(history) {
            const lang = i18n[currentLang];
            let html = '';
            history.forEach(t => {
                const selfConf = Math.round((t.self_confidence || t.confidence || 0.8) * 100);
                const outConf = Math.round((t.output_confidence || 0.8) * 100);
                html += `<div class="turn">
                    <div class="turn-header">
                        <span class="badge" style="background:#dbeafe;">${t.model}</span>
                        ${t.role ? `<span class="badge">${lang.role}: ${t.role}</span>` : ''}
                        ${t.intent ? `<span class="badge">${lang.intent}: ${t.intent}</span>` : ''}
                    </div>
                    <div class="utterance">🗣️ ${t.utterance || ''}</div>`;
                if (t.deliverable && t.deliverable.trim() !== '') {
                    html += `<div class="deliverable"><div class="deliverable-label">${lang.deliverable}</div>${t.deliverable}</div>`;
                }
                html += `<div class="meta-section">
                        <div class="meta-card"><div class="meta-label">🎯 ${lang.focus}</div><div class="meta-value">${t.focus || ''}</div></div>
                        <div class="meta-card"><div class="meta-label">🔗 ${lang.extension}</div><div class="meta-value">${t.extension || ''}</div></div>
                        <div class="meta-card"><div class="meta-label">💪 ${lang.selfConfidence}</div><div>${selfConf}%</div><div class="confidence-bar"><div class="confidence-fill" style="width:${selfConf}%"></div></div></div>
                        <div class="meta-card"><div class="meta-label">📊 ${lang.outputConfidence}</div><div>${outConf}%</div><div class="confidence-bar"><div class="confidence-fill" style="width:${outConf}%"></div></div></div>
                        <div class="meta-card"><div class="meta-label">📐 ${lang.convergence}</div><div class="meta-value">${t.convergence_process || ''}</div></div>`;
                if (t.depends_on) html += `<div class="meta-card"><div class="meta-label">🔗 ${lang.depends}</div><div class="meta-value">${t.depends_on.join(', ')}</div></div>`;
                if (t.assumptions) html += `<div class="meta-card"><div class="meta-label">💭 ${lang.assumptions}</div><div class="meta-value">${t.assumptions.join('; ')}</div></div>`;
                if (t.actionable) html += `<div class="meta-card"><div class="meta-label">✅ ${lang.actionable}</div><div class="meta-value">${t.actionable}</div></div>`;
                if (t.merge_strategy) html += `<div class="meta-card"><div class="meta-label">🤝 ${lang.merge}</div><div class="meta-value">${t.merge_strategy}</div></div>`;
                html += `</div></div>`;
            });
            resultContainer.innerHTML = html || '<div>无结果</div>';
        }

        function updateUILanguage() {
            const lang = i18n[currentLang];
            document.getElementById('main-title').innerText = lang.mainTitle;
            document.getElementById('subtitle-text').innerText = lang.subtitle;
            document.getElementById('mission-text').innerHTML = lang.missionText;
            document.getElementById('contact-info').innerHTML = lang.contactInfo;
            taskLabel.innerText = lang.taskLabel;
            executeBtn.innerText = lang.executeBtn;
            clearBtn.innerText = lang.clearBtn;
            renderModelConfig();
        }

        langSelect.addEventListener('change', e => { currentLang = e.target.value; updateUILanguage(); });
        modeSelect.addEventListener('change', e => { currentMode = e.target.value; });
        clearBtn.addEventListener('click', () => resultContainer.innerHTML = `<div style="text-align:center;padding:30px;">${i18n[currentLang].waiting}</div>`);
        executeBtn.addEventListener('click', runTask);

        // 初始化
        renderModelConfig();
        updateUILanguage();
    })();
</script>
</body>
</html>
