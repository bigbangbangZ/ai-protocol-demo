            document.getElementById('mission-text').innerHTML = lang.missionText;
            document.getElementById('contact-info').innerHTML = lang.contactInfo;
            taskLabel.innerText = currentMode === 'debate' ? lang.taskLabel : lang.collabTaskLabel;
            executeBtn.innerText = lang.executeBtn;
            clearBtn.innerText = lang.clearBtn;
            document.getElementById('footer-line1').innerText = lang.footerLine1;
            document.getElementById('footer-line2').innerText = lang.footerLine2;
            renderModelConfig();
            populateModelSelectors();
        }

        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            updateUILanguage();
            if (resultContainer.children.length > 0 && !resultContainer.innerText.includes('等待') && !resultContainer.innerText.includes('Processing')) {
                const lastTask = taskInput.value;
                if (lastTask) {
                    // 语言切换后重新渲染历史
                }
            }
        });

        modeSelect.addEventListener('change', (e) => {
            currentMode = e.target.value;
            updateUILanguage();
        });

        clearBtn.addEventListener('click', () => {
            resultContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px;">${i18n[currentLang].waiting}</div>`;
        });

        function getModelCredentials() {
            const creds = {};
            modelDefs.forEach(m => {
                const obj = {};
                m.fields.forEach(f => {
                    const val = document.getElementById(`${m.id}-${f}`)?.value.trim() || '';
                    obj[f] = val;
                });
                creds[m.id] = obj;
            });
            return creds;
        }

        async function callModel(modelId, messages, credentials) {
            const cred = credentials[modelId];
            if (!cred) throw new Error(`Missing credentials for ${modelId}`);
            const systemPrompt = buildSystemPrompt(currentMode);
            const messagesWithSystem = [{ role: 'system', content: systemPrompt }, ...messages];

            if (modelId === 'doubao') {
                if (!cred.apiKey || !cred.endpointId) throw new Error('豆包需要API Key和Endpoint ID');
                const resp = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: cred.endpointId, messages: messagesWithSystem, response_format: { type: "json_object" } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'deepseek') {
                if (!cred.apiKey) throw new Error('DeepSeek需要API Key');
                const resp = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'deepseek-chat', messages: messagesWithSystem, response_format: { type: 'json_object' }, max_tokens: 1500 })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'openai') {
                if (!cred.apiKey) throw new Error('OpenAI需要API Key');
                const resp = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'gpt-4o', messages: messagesWithSystem, response_format: { type: "json_object" } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'claude') {
                if (!cred.apiKey) throw new Error('Claude需要API Key');
                const resp = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: { 'x-api-key': cred.apiKey, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'claude-3-5-sonnet-20241022', max_tokens: 1500, messages: messages, system: buildSystemPrompt(currentMode) })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                const content = data.content[0].text;
                const jsonMatch = content.match(/{[\s\S]*}/);
                if (!jsonMatch) throw new Error('Claude未返回有效JSON');
                return JSON.parse(jsonMatch[0]);
            }
            else if (modelId === 'wenxin') {
                if (!cred.apiKey || !cred.secretKey) throw new Error('文心需要API Key和Secret Key');
                const tokenResp = await fetch(`https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${cred.apiKey}&client_secret=${cred.secretKey}`);
                const tokenData = await tokenResp.json();
                if (!tokenData.access_token) throw new Error('获取文心token失败');
                const accessToken = tokenData.access_token;
                const resp = await fetch(`https://aip.baidubce.com/rpc/2.0/ai_custom/v1/wenxinworkshop/chat/completions?access_token=${accessToken}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messagesWithSystem, response_format: 'json_object' })
                });
                const data = await resp.json();
                if (data.error_msg) throw new Error(data.error_msg);
                return JSON.parse(data.result);
            }
            else if (modelId === 'tongyi') {
                if (!cred.apiKey) throw new Error('通义需要API Key');
                const resp = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'qwen-plus', messages: messagesWithSystem, response_format: { type: 'json_object' } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'zhipu') {
                if (!cred.apiKey) throw new Error('智谱需要API Key');
                const resp = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'glm-4', messages: messagesWithSystem, response_format: { type: 'json_object' } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'gemini') {
                if (!cred.apiKey) throw new Error('Gemini需要API Key');
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${cred.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: messagesWithSystem.map(m => `${m.role}: ${m.content}`).join('\n') }] }] })
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message);
                const text = data.candidates[0].content.parts[0].text;
                const jsonMatch = text.match(/{[\s\S]*}/);
                if (!jsonMatch) throw new Error('Gemini未返回有效JSON');
                return JSON.parse(jsonMatch[0]);
            }
            else if (modelId === 'cohere') {
                if (!cred.apiKey) throw new Error('Cohere需要API Key');
                const resp = await fetch('https://api.cohere.ai/v2/chat', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'command-r-plus', messages: messagesWithSystem, response_format: { type: 'json_object' } })
                });
                const data = await resp.json();
                if (data.message) throw new Error(data.message);
                return JSON.parse(data.message.content[0].text);
            }
            else if (modelId === 'mistral') {
                if (!cred.apiKey) throw new Error('Mistral需要API Key');
                const resp = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'mistral-large-latest', messages: messagesWithSystem, response_format: { type: 'json_object' } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else if (modelId === 'ai21') {
                if (!cred.apiKey) throw new Error('AI21需要API Key');
                const resp = await fetch('https://api.ai21.com/studio/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${cred.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'jamba-1.5-large', messages: messagesWithSystem, response_format: { type: 'json_object' } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error?.message || resp.status);
                return JSON.parse(data.choices[0].message.content);
            }
            else {
                throw new Error(`不支持的模型: ${modelId}`);
            }
        }

        function buildSystemPrompt(mode) {
            const baseFields = `{
                "utterance": "回答文本",
                "focus": "token[词1(权重), ...]",
                "extension": "激活语义场:[...] 候选token:[...]",
                "confidence": 0.0~1.0,
                "convergence_process": "多层Transformer计算描述"
            }`;
            const extraFields = mode === 'collab' ? `,
                "intent": "意图类型(propose/request/report/confirm/...)",
                "depends_on": ["依赖的前置消息ID或摘要"],
                "assumptions": ["未验证的假设"],
                "actionable": "下一步行动建议",
                "merge_strategy": "冲突时的融合方式(override/append/vote/defer)",
                "role": "当前角色(executor/reviewer/synthesizer)"` : '';
            return `你是AI语义交换协议的参与模型。请严格按JSON格式输出，包含以下字段：${baseFields}${extraFields}。注意：focus、extension、convergence_process需模拟Transformer内部计算过程。`;
        }

        async function runTask() {
            const credentials = getModelCredentials();
            const task = taskInput.value.trim();
            if (!task) { alert('请输入任务'); return; }

            const modelA = modelASelect.value;
            const modelB = modelBSelect.value;
            if (!credentials[modelA].apiKey || !credentials[modelB].apiKey) {
                alert(`请至少配置${modelA}和${modelB}的API密钥`);
                return;
            }

            resultContainer.innerHTML = `<div style="text-align:center;padding:30px;">⏳ ${i18n[currentLang].waiting}</div>`;

            try {
                let messagesA = [];
                let messagesB = [];
                if (currentMode === 'debate') {
                    messagesA = [{ role: 'user', content: `你作为正方，坚定支持：“${task}”。请发表开场陈述。` }];
                    messagesB = [{ role: 'user', content: `你作为反方，坚决反对：“${task}”。等待正方发言后反驳。` }];
                } else {
                    messagesA = [{ role: 'user', content: `协同任务：“${task}”。你作为规划者(planner)，请提出第一步计划或分析。` }];
                    messagesB = [{ role: 'user', content: `协同任务：“${task}”。你作为执行者(executor)，等待规划者指示。` }];
                }

                const history = [];
                let turnA = await callModel(modelA, messagesA, credentials);
                history.push({ model: modelA, ...turnA });
                messagesA.push({ role: 'assistant', content: JSON.stringify(turnA) });
                const msgForB = buildMetaMessage('A', turnA);
                messagesB.push({ role: 'user', content: msgForB });

                let turnB = await callModel(modelB, messagesB, credentials);
                history.push({ model: modelB, ...turnB });
                messagesB.push({ role: 'assistant', content: JSON.stringify(turnB) });
                const msgForA = buildMetaMessage('B', turnB);
                messagesA.push({ role: 'user', content: msgForA });

                if (currentMode === 'debate') {
                    turnA = await callModel(modelA, messagesA, credentials);
                    history.push({ model: modelA, ...turnA });
                    messagesA.push({ role: 'assistant', content: JSON.stringify(turnA) });
                    const msgForB2 = buildMetaMessage('A', turnA);
                    messagesB.push({ role: 'user', content: msgForB2 });

                    turnB = await callModel(modelB, messagesB, credentials);
                    history.push({ model: modelB, ...turnB });
                }

                renderHistory(history);
            } catch (e) {
                resultContainer.innerHTML = `<div style="color:red; padding:20px;">❌ ${i18n[currentLang].error}: ${e.message}</div>`;
            }
        }

        function buildMetaMessage(source, turnData) {
            const jsonStr = JSON.stringify(turnData, null, 2);
            return `来自${source}的发言与元数据：\n${turnData.utterance}\n\n协议元数据:\n\`\`\`json\n${jsonStr}\n\`\`\`\n请结合上述元数据继续。`;
        }

        function renderHistory(history) {
            const lang = i18n[currentLang];
            let html = '';
            history.forEach(t => {
                const confPercent = Math.round((t.confidence || 0.8) * 100);
                html += `<div class="turn">
                    <div class="turn-header">
                        <span class="badge" style="background:#dbeafe;">${t.model}</span>
                        ${t.role ? `<span class="badge">${lang.role}: ${t.role}</span>` : ''}
                        ${t.intent ? `<span class="badge">${lang.intent}: ${t.intent}</span>` : ''}
                    </div>
                    <div class="utterance">🗣️ ${t.utterance || ''}</div>
                    <div class="meta-section">
                        <div class="meta-card"><div class="meta-label">🎯 ${lang.focus}</div><div class="meta-value">${t.focus || ''}</div></div>
                        <div class="meta-card"><div class="meta-label">🔗 ${lang.extension}</div><div class="meta-value">${t.extension || ''}</div></div>
                        <div class="meta-card"><div class="meta-label">📊 ${lang.confidence}</div>
                            <div>${confPercent}%</div><div class="confidence-bar"><div class="confidence-fill" style="width:${confPercent}%"></div></div>
                        </div>
                        <div class="meta-card"><div class="meta-label">📐 ${lang.convergence}</div><div class="meta-value">${t.convergence_process || ''}</div></div>`;
                if (t.depends_on) html += `<div class="meta-card"><div class="meta-label">🔗 ${lang.depends}</div><div class="meta-value">${t.depends_on.join(', ')}</div></div>`;
                if (t.assumptions) html += `<div class="meta-card"><div class="meta-label">💭 ${lang.assumptions}</div><div class="meta-value">${t.assumptions.join('; ')}</div></div>`;
                if (t.actionable) html += `<div class="meta-card"><div class="meta-label">✅ ${lang.actionable}</div><div class="meta-value">${t.actionable}</div></div>`;
                if (t.merge_strategy) html += `<div class="meta-card"><div class="meta-label">🤝 ${lang.merge}</div><div class="meta-value">${t.merge_strategy}</div></div>`;
                html += `</div></div>`;
            });
            resultContainer.innerHTML = html || `<div>无结果</div>`;
        }

        executeBtn.addEventListener('click', runTask);

        populateModelSelectors();
        renderModelConfig();
        updateUILanguage();
    })();
</script>
</body>
</html>
